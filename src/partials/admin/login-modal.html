  <!-- ==================== 1. LOGIN MODAL OVERLAY (SECURITY GUARD) ==================== -->
  <div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-xl p-4">
    <div class="glass-card bg-adminSurfaceDark border border-purple-500/30 rounded-3xl max-w-md w-full p-8 space-y-6 shadow-[0_0_50px_rgba(139,92,246,0.15)] relative">
      
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-accent/10 border border-accent/30 text-accent mb-2">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 002-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
        <h2 class="text-2xl font-bold text-white tracking-tight">Admin Authentication</h2>
        <p class="text-xs text-slate-400">Enter your administrator credentials to access live website submissions.</p>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" autocomplete="off" class="space-y-4">
        <div class="space-y-1">
          <label for="admin-username" class="text-[10px] font-mono text-white/80 uppercase tracking-wider font-bold">User</label>
          <input type="text" id="admin-username" required placeholder="User" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeydown="preventUndo(event)" class="w-full px-4 py-2.5 rounded-xl bg-black/60 border border-white/10 text-white text-xs focus:outline-none focus:border-accent transition-colors font-mono">
        </div>

        <div class="space-y-1">
          <label for="admin-password" class="text-[10px] font-mono text-white/80 uppercase tracking-wider font-bold">Password</label>
          <input type="password" id="admin-password" required placeholder="Password" autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false" onkeydown="preventUndo(event)" class="w-full px-4 py-2.5 rounded-xl bg-black/60 border border-white/10 text-white text-xs focus:outline-none focus:border-accent transition-colors font-mono">
        </div>

        <div id="login-error" class="hidden text-xs text-red-400 font-mono bg-red-500/10 border border-red-500/20 p-3 rounded-xl"></div>

        <button type="submit" id="login-btn" class="w-full py-3 rounded-xl text-xs font-semibold font-mono uppercase tracking-wider bg-accent hover:bg-purple-600 text-white transition-all shadow-lg shadow-purple-900/40">
          Authenticate & Unlock
        </button>
      </form>

      <div class="text-center border-t border-white/10 pt-4">
        <p class="text-[11px] text-slate-400 font-mono">
          Protected by JWT Auth & Security Rate Limiter
        </p>
      </div>
    </div>
  </div>
