  <!-- Change Password Modal -->
  <div id="password-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
    <div class="glass-card bg-adminSurfaceDark border border-white/15 rounded-3xl max-w-md w-full p-6 space-y-5 shadow-2xl relative">
      <div class="flex items-center justify-between border-b border-white/10 pb-3">
        <h3 class="text-sm font-bold text-white font-mono flex items-center space-x-2">
          <span>🔒 Update Admin Password</span>
        </h3>
        <button onclick="closePasswordModal()" class="text-slate-400 hover:text-white text-xs font-mono">[Close]</button>
      </div>

      <form onsubmit="handleChangePassword(event)" class="space-y-4">
        <div class="space-y-1">
          <label class="text-[10px] font-mono text-white/80 uppercase font-bold">Current Password</label>
          <input type="password" id="current-pass-input" required class="w-full px-3.5 py-2 rounded-xl bg-black/60 border border-white/10 text-white text-xs focus:outline-none focus:border-accent">
        </div>
        <div class="space-y-1">
          <label class="text-[10px] font-mono text-white/80 uppercase font-bold">New Password (Min 6 chars)</label>
          <input type="password" id="new-pass-input" required minlength="6" class="w-full px-3.5 py-2 rounded-xl bg-black/60 border border-white/10 text-white text-xs focus:outline-none focus:border-accent">
        </div>

        <div id="pass-msg" class="hidden text-xs font-mono p-2.5 rounded-lg"></div>

        <button type="submit" class="w-full py-2.5 rounded-xl text-xs font-semibold font-mono bg-accent hover:bg-purple-600 text-white transition-all">
          Update Password
        </button>
      </form>
    </div>
  </div>
